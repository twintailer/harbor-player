name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test URL parsing and subtitle settings
        run: |
          swiftc -parse-as-library Sources/PlaybackRequest.swift Sources/SubtitleSettings.swift Sources/PlaybackTypes.swift Sources/TrackPreferences.swift Sources/IntroSkipService.swift Tests/LogicTests.swift -o /tmp/logic-tests
          /tmp/logic-tests
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Resolve packages
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -project HarborPlayer.xcodeproj -scheme HarborPlayer -clonedSourcePackagesDirPath spm; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
      - name: Build unsigned iPhone application
        run: |
          set -o pipefail
          xcodebuild -project HarborPlayer.xcodeproj -scheme HarborPlayer -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build -clonedSourcePackagesDirPath spm CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build 2>&1 | tee build.log | tail -80
      - name: Package and verify IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HarborPlayer.app Payload/
          test -f Payload/HarborPlayer.app/Anime4K/Anime4K_Upscale_DTD_x2.glsl
          test -f Payload/HarborPlayer.app/Fonts/Inter.ttf
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' Payload/HarborPlayer.app/Info.plist
          zip -qr HarborPlayer_1.1.0_unsigned.ipa Payload
          shasum -a 256 HarborPlayer_1.1.0_unsigned.ipa > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: HarborPlayer-iPhone-unsigned
          path: |
            HarborPlayer_1.1.0_unsigned.ipa
            SHA256SUMS
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          retention-days: 3
      - name: Playback and interface tests on iPhone Simulator
        timeout-minutes: 15
        run: |
          set -o pipefail
          python3 Tests/fixture_server.py --self-test
          python3 Tests/fixture_server.py >/tmp/fixture-server.log 2>&1 &
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          xcodebuild -project HarborPlayer.xcodeproj -scheme HarborPlayer -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build-simulator -clonedSourcePackagesDirPath spm -resultBundlePath ui-tests.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test 2>&1 | tee ui-tests.log | tail -70
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d ui-tests.xcresult ]; then xcrun xcresulttool export attachments --path ui-tests.xcresult --output-path screenshots; fi
          for DEVICE in $(xcrun simctl list devices booted -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(" ".join(v["udid"] for vs in d["devices"].values() for v in vs if v["state"]=="Booted"))'); do
            CONTAINER=$(xcrun simctl get_app_container "$DEVICE" app.harbor.player data 2>/dev/null || true)
            if [ -f "$CONTAINER/tmp/harbor-mpv.log" ]; then cp "$CONTAINER/tmp/harbor-mpv.log" "harbor-mpv-$DEVICE.log"; fi
          done
          find "$HOME/Library/Developer/CoreSimulator/Devices" -path '*/tmp/harbor-mpv.log' -exec cp {} harbor-mpv.log \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-UI-tests
          path: |
            screenshots/*.png
            screenshots/*.txt
            screenshots/manifest.json
            ui-tests.log
            harbor-mpv*.log
          retention-days: 7
